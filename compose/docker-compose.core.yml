# =============================================================================
# compose/docker-compose.core.yml
# EBC Lakehouse — CORE module
#
# Compute-, storage-, catalog-, and orchestration-agnostic services that have
# no awareness of any specific source system or BI consumer. This module is
# self-sufficient: bringing it up gives you a queryable Iceberg lakehouse on
# MinIO with Trino on top and Airflow ready to schedule dbt-trino jobs.
#
# Includes:
#   • Apache Kafka 3.7 in KRaft mode (no Zookeeper)
#   • Confluent Schema Registry
#   • Kafka UI
#   • MinIO + bucket init
#   • Apache Polaris (Iceberg REST catalog) + Postgres + admin bootstrap
#     + catalog/namespace bootstrap
#   • Trino coordinator (Iceberg connector → Polaris) + trino-init schema DDL
#   • PostgreSQL metadata store (shared by Airflow and Superset)
#   • Apache Airflow init/scheduler/webserver
#   • Apache Flink 1.20 — JobManager, TaskManager (16 slots), SQL Gateway,
#     plus flink-init that POSTs every flink/jobs/*.sql to the SQL Gateway
#     so CDC source + Iceberg sink jobs run continuously.
#
# Kafka Connect is intentionally NOT in this module — Flink CDC owns every
# streaming path (DB → Kafka and Kafka → Iceberg).
#
# Network contract: every service joins the external bridge network
# `ebc-lakehouse-network`. Create it once with:
#   docker network create ebc-lakehouse-network --driver bridge
# Or rely on scripts/init_core.sh (idempotent).
# =============================================================================

# ── Airflow shared config ─────────────────────────────────────────────────────
x-airflow-common: &airflow-common
  build: ../airflow
  env_file: ../.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-meta/airflow
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: '${AIRFLOW_WEBSERVER_SECRET}'
    AIRFLOW_CONN_TRINO_DEFAULT: 'trino://ebc_user@trino:8080/iceberg/silver'
    TRINO_HOST:               trino
    TRINO_PORT:               '8080'
    TRINO_USER:               ebc_user
    TRINO_CATALOG:            iceberg
    POLARIS_URI:              http://polaris:8181/api/catalog
    POLARIS_MGMT_URI:         http://polaris:8181/api/management/v1
    POLARIS_CATALOG:          ebc_lakehouse
    POLARIS_CLIENT_ID:        root
    POLARIS_CLIENT_SECRET:    s3cr3t
    DBT_PROFILES_DIR:         /opt/airflow/dbt/ebc_lakehouse
    AWS_ACCESS_KEY_ID:        minioadmin
    AWS_SECRET_ACCESS_KEY:    minioadmin
    AWS_DEFAULT_REGION:       us-east-1
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"console"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: 'ebc_lakehouse_local'
    OPENLINEAGE_TRANSPORT: '{"type":"console"}'
    OPENLINEAGE_NAMESPACE: 'ebc_lakehouse_local'
  volumes:
    - ../airflow/dags:/opt/airflow/dags
    - ../airflow/plugins:/opt/airflow/plugins
    - ../dbt:/opt/airflow/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-meta:
      condition: service_healthy

services:
  # ── Apache Kafka 3.7 (KRaft, no Zookeeper) ────────────────────────────────
  # Single-node combined controller+broker. Storage formatted on first boot
  # using CLUSTER_ID; subsequent boots reuse the meta.properties on the
  # mounted volume.
  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: ebc-kafka
    hostname: kafka
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG4J_ROOT_LOGLEVEL: WARN
      # 22-char base64 cluster ID required by KRaft; safe to keep static for
      # a single-node dev cluster but MUST be replaced for a fresh cluster.
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD', 'kafka-topics', '--list', '--bootstrap-server', 'localhost:29092']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ── Confluent Schema Registry ─────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: ebc-schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '127.0.0.1:8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_LOG4J_ROOT_LOGLEVEL: WARN
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8081/subjects']
      interval: 15s
      retries: 10

  # ── Kafka Connect — REMOVED ───────────────────────────────────────────────
  # Every Debezium source connector has been replaced by a Flink CDC job:
  #   • Postgres (ach / meeza / ipn)  → flink/jobs/10_cdc_postgres.sql
  #   • MongoDB  (meeza_digital wallet) → flink/jobs/11_cdc_mongodb.sql
  #   • SQL Server (atm_sessions)     → flink/jobs/12_cdc_sqlserver.sql
  # Iceberg sinks were already on Flink (flink/jobs/20-24_*.sql).
  #
  # The kafka-connect service was deleted from this file in the same change
  # that retired the Cassandra source and introduced MS SQL Server. The
  # `kafka/connectors/_archive_debezium_*/` directories hold the historical
  # JSONs for rollback reference.

  # ── Apache Flink — JobManager + TaskManager + SQL Gateway ─────────────────
  # Replaces the Iceberg-sink path Kafka Connect used to own. Each Flink job
  # under flink/jobs/10_*.sql is submitted by scripts/init_flink.sh and runs
  # as a long-lived streaming pipeline (Kafka topic → Polaris-managed Iceberg
  # table). Flink CDC sources (phase2) are pre-loaded in the image but
  # disabled until explicitly enabled.
  flink-jobmanager:
    build: ../flink
    container_name: ebc-flink-jobmanager
    command: jobmanager
    ports:
      # host:container — Flink's REST/Web port inside the container is the
      # default 8081 (we don't override `rest.port`). Expose it on host
      # 8881 to avoid colliding with anything else the user runs on 8081.
      - '127.0.0.1:8881:8081'
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.bind-host: 0.0.0.0
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        # /tmp is owned by the `flink` user inside the image (volume root is
        # root-owned and the flink user can't mkdir under it; the checkpoint
        # coordinator fails with "Failed to create directory for shared state"
        # if we point checkpoints at /opt/flink/state). Container-local is fine
        # for dev/POC — for prod, point at S3 (MinIO) or a chowned volume.
        state.checkpoints.dir: file:///tmp/flink-checkpoints
        state.savepoints.dir: file:///tmp/flink-savepoints
        execution.checkpointing.interval: 30000
        execution.checkpointing.mode: EXACTLY_ONCE
    volumes:
      - flink-state:/opt/flink/state
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8081/overview']
      interval: 15s
      timeout:  5s
      retries:  20
      start_period: 30s

  flink-taskmanager:
    build: ../flink
    container_name: ebc-flink-taskmanager
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # 16 slots = headroom for 5 CDC sources (postgres x3, mongo, sqlserver) +
        # 5 Iceberg sinks + ad-hoc SQL Gateway queries, all at parallelism 1.
        # Was 4 → caused NoResourceAvailableException on every sink job.
        taskmanager.numberOfTaskSlots: 16
        taskmanager.bind-host: 0.0.0.0
        taskmanager.host:      flink-taskmanager
    volumes:
      - flink-state:/opt/flink/state
    deploy:
      replicas: 1

  # SQL Gateway: REST surface inside the cluster is the default 8083 (we
  # don't override `sql-gateway.endpoint.rest.port`). Exposed on host 8883
  # for consistency with the JM's 8881 mapping above.
  flink-sql-gateway:
    build: ../flink
    container_name: ebc-flink-sql-gateway
    command: ['bash', '-c', '/opt/flink/bin/sql-gateway.sh start-foreground -Dsql-gateway.endpoint.rest.address=0.0.0.0 -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0']
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    ports:
      # host:container
      - '127.0.0.1:8883:8083'
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.address: flink-jobmanager
        rest.port: 8081
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8083/info']
      interval: 15s
      timeout:  5s
      retries:  20
      start_period: 30s

  # ── Flink job submitter (one-shot) ────────────────────────────────────────
  # Submits every flink/jobs/*.sql via the SQL Gateway REST API. Idempotent:
  # if a job with the same name already runs, it's cancelled and resubmitted
  # so config edits roll out cleanly on re-run.
  flink-init:
    image: curlimages/curl:8.10.1
    container_name: ebc-flink-init
    depends_on:
      flink-sql-gateway:
        condition: service_healthy
    entrypoint: ['sh', '/scripts/submit_flink_jobs.sh']
    volumes:
      - ../flink/jobs:/jobs:ro
      - ../scripts/flink:/scripts:ro
    environment:
      # Intra-network URLs use the *container* ports, not the host-side
      # mapping. The JM listens on 8081 and the SQL Gateway on 8083 inside
      # the docker network; host ports (8881 / 8883) are for browser/curl
      # access only.
      FLINK_REST:          http://flink-jobmanager:8081
      FLINK_SQL_GATEWAY:   http://flink-sql-gateway:8083
    restart: 'no'

  # ── Kafka UI ──────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ebc-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '127.0.0.1:8090:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: ebc-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      # Kafka Connect was removed in the Flink migration. The kafkaconnect
      # block in Kafka UI's config is now empty; the UI just shows topics +
      # the Schema Registry. Flink's own Web UI on :8081 is the place to
      # inspect streaming pipelines.

  # ── MinIO (S3-compatible Iceberg storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ebc-minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER:     minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # MINIO_DOMAIN tells the server to accept virtual-host-style requests
      # against this parent domain. Combined with the network aliases below
      # (ebc-lakehouse.minio etc), this lets AWS-SDK virtual-host URLs work
      # against MinIO — required because Polaris's S3 client ignores the
      # storageConfigInfo `pathStyleAccess` flag for its own writes.
      MINIO_DOMAIN:        minio
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    networks:
      # Register every Iceberg bucket as a virtual-host alias for MinIO so that
      # AWS-SDK virtual-host-style URLs (e.g. ebc-lakehouse.minio:9000) resolve
      # back to this container. Polaris's S3 client does NOT honour the
      # storageConfigInfo `pathStyleAccess` flag for its own writes, so we must
      # make virtual-hosted URLs work. Add one alias per bucket that needs to
      # be written by Polaris itself.
      default:
        aliases:
          - minio
          - ebc-lakehouse.minio
          - ebc-warehouse.minio
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: ebc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/ebc-lakehouse;
        mc mb --ignore-existing local/ebc-warehouse;
        touch /tmp/.keep;
        # Canonical medallion prefixes (one MinIO folder per Polaris namespace).
        # Namespace locations in init_polaris.py point at these paths.
        mc cp /tmp/.keep local/ebc-lakehouse/bronze/.keep;
        mc cp /tmp/.keep local/ebc-lakehouse/silver/.keep;
        mc cp /tmp/.keep local/ebc-lakehouse/gold/.keep;
        mc cp /tmp/.keep local/ebc-lakehouse/serving/.keep;
        mc anonymous set public local/ebc-lakehouse;
        rm /tmp/.keep;
        echo "Medallion layer prefixes initialised: bronze/ silver/ gold/ serving/";
      '

  # ── Polaris metadata store ────────────────────────────────────────────────
  polaris-postgres:
    image: postgres:16
    container_name: ebc-polaris-postgres
    environment:
      POSTGRES_USER:     polaris
      POSTGRES_PASSWORD: polaris
      POSTGRES_DB:       polaris
    volumes:
      - polaris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U polaris -d polaris']
      interval: 10s
      retries: 10

  # ── Polaris realm bootstrap (one-shot) ────────────────────────────────────
  polaris-bootstrap:
    image: apache/polaris-admin-tool:latest
    container_name: ebc-polaris-bootstrap
    depends_on:
      polaris-postgres:
        condition: service_healthy
    environment:
      polaris.persistence.type:        relational-jdbc
      quarkus.datasource.jdbc.url:     jdbc:postgresql://polaris-postgres:5432/polaris
      quarkus.datasource.username:     polaris
      quarkus.datasource.password:     polaris
      POLARIS_BOOTSTRAP_CREDENTIALS:   POLARIS,root,s3cr3t
    command: ['bootstrap', '--realm', 'POLARIS', '--credential', 'POLARIS,root,s3cr3t']
    restart: 'no'

  # ── Polaris server (Iceberg REST catalog) ─────────────────────────────────
  polaris:
    image: apache/polaris:latest
    container_name: ebc-polaris
    depends_on:
      polaris-postgres:
        condition: service_healthy
      polaris-bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8181:8181'
      - '127.0.0.1:8182:8182'
    environment:
      polaris.persistence.type:                          relational-jdbc
      quarkus.datasource.jdbc.url:                       jdbc:postgresql://polaris-postgres:5432/polaris
      quarkus.datasource.username:                       polaris
      quarkus.datasource.password:                       polaris
      polaris.realm-context.realms:                      POLARIS
      polaris.realm-context.default-realm:               POLARIS
      polaris.readiness.ignore-severe-issues: "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES":    'true'
      polaris.features."SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION": 'true'
      polaris.features."DROP_WITH_PURGE_ENABLED":         'true'
      POLARIS_READINESS_IGNORE_SEVERE_ISSUES: "true"
      # ── Quarkus-mapped feature flags ───────────────────────────────────────
      # The dotted-string names above (polaris.features."X") are not picked up
      # by Quarkus inside the container — only the double-underscore form is.
      # MinIO compatibility is handled per-catalog via storageConfigInfo
      # `stsUnavailable: true` (see polaris/catalog-init/init_polaris.py).
      # SKIP_CREDENTIAL_SUBSCOPING_INDIRECTION is intentionally NOT set:
      # Polaris's own readiness check warns it leaks server creds to every
      # client and recommends stsUnavailable on the storage config instead.
      POLARIS_FEATURES__ALLOW_INSECURE_STORAGE_TYPES__: "true"
      POLARIS_FEATURES__SUPPORTED_CATALOG_STORAGE_TYPES__: '["FILE","S3","GCS","AZURE"]'
      POLARIS_FEATURES__DROP_WITH_PURGE_ENABLED__: "true"
      # Allow namespaces and tables to live at locations that don't follow the
      # default <warehouse>/<namespace>/<table>/ scheme. Required so we can
      # remap bronze → s3://ebc-lakehouse/bronze/ etc. instead of
      # s3://ebc-lakehouse/bronze/.
      POLARIS_FEATURES__ALLOW_UNSTRUCTURED_TABLE_LOCATION__: "true"
      POLARIS_FEATURES__ALLOW_NAMESPACE_LOCATION_OVERLAP__: "true"
      POLARIS_FEATURES__ALLOW_TABLE_LOCATION_OVERLAP__: "true"
      quarkus.log.level:                                  INFO
      AWS_REGION:                                         us-east-1
      AWS_ACCESS_KEY_ID:                                  minioadmin
      AWS_SECRET_ACCESS_KEY:                              minioadmin
      # ── Polaris→MinIO credentials ─────────────────────────────────────────
      # With stsUnavailable=true on the catalog, Polaris uses the AWS SDK
      # default chain for its own S3 writes (metadata.json on createTable).
      # The chain in the Quarkus JVM was hitting IMDS (5s timeout) and
      # ignoring env vars, so we pin static creds via JVM system properties
      # — they sit at position 1 in the v2 chain — and turn IMDS off.
      AWS_EC2_METADATA_DISABLED:        "true"
      AWS_ENDPOINT_URL:                 "http://minio:9000"
      AWS_ENDPOINT_URL_S3:              "http://minio:9000"
      AWS_S3_FORCE_PATH_STYLE:          "true"
      AWS_S3_USE_PATH_STYLE_ENDPOINT:   "true"
      JAVA_TOOL_OPTIONS: >-
        -Daws.accessKeyId=minioadmin
        -Daws.secretAccessKey=minioadmin
        -Daws.region=us-east-1
        -Daws.endpointUrlS3=http://minio:9000
        -Daws.s3.endpoint=http://minio:9000
        -Daws.s3UsePathStyleEndpoint=true
        -Dsoftware.amazon.awssdk.s3.forcePathStyle=true
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8182/q/health/ready']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Polaris catalog + namespace bootstrap (one-shot) ──────────────────────
  polaris-catalog-init:
    image: python:3.11-slim
    container_name: ebc-polaris-catalog-init
    depends_on:
      polaris:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    entrypoint: >
      sh -c "pip install --quiet 'requests>=2.32.0' &&
             python /app/init_polaris.py"
    volumes:
      - ../polaris/catalog-init/init_polaris.py:/app/init_polaris.py:ro
    environment:
      POLARIS_BASE_URL:      http://polaris:8181
      POLARIS_REALM:         POLARIS
      POLARIS_CLIENT_ID:     root
      POLARIS_CLIENT_SECRET: s3cr3t
      POLARIS_CATALOG:       ebc_lakehouse
      WAREHOUSE_LOCATION:    s3://ebc-lakehouse/
      MINIO_ENDPOINT:        http://minio:9000
      AWS_ACCESS_KEY_ID:     minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION:            us-east-1
    restart: 'no'

  # ── Trino (SQL compute over Iceberg/Polaris) ──────────────────────────────
  trino:
    image: trinodb/trino:latest
    container_name: ebc-trino
    depends_on:
      polaris-catalog-init:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ../trino/etc:/etc/trino:ro
      - trino-data:/data/trino
    environment:
      JAVA_TOOL_OPTIONS: '-Xms2G -Xmx4G'
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/v1/info']
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ── Trino DDL bootstrap (one-shot) ────────────────────────────────────────
  # Creates the 4 medallion schemas in the Trino `iceberg` catalog and
  # pre-creates Serving-layer + operational tables with stable BI-facing
  # DDL. Mirrors the role the old ClickHouse 01_create_databases.sql played.
  #
  # Idempotent: CREATE … IF NOT EXISTS everywhere. The runner exits non-zero
  # if any validation invariant fails, so downstream services can gate on it
  # via `depends_on.trino-init.condition: service_completed_successfully`.
  trino-init:
    image: python:3.11-slim
    container_name: ebc-trino-init
    depends_on:
      trino:
        condition: service_healthy
    entrypoint: >
      sh -c "pip install --quiet 'trino>=0.330.0' &&
             python /app/init_trino.py"
    volumes:
      - ../trino/init:/app:ro
    environment:
      TRINO_HOST:    trino
      TRINO_PORT:    "8080"
      TRINO_USER:    ebc_user
      TRINO_CATALOG: iceberg
    restart: 'no'

  # ── PostgreSQL metadata DB (shared by Airflow + Superset) ─────────────────
  # Owned by Core because Airflow lives in Core. Superset connects across the
  # external network and creates its own `superset` database on first boot.
  postgres-meta:
    image: postgres:16
    container_name: ebc-postgres-meta
    environment:
      POSTGRES_USER:     airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB:       airflow
    volumes:
      - postgres-meta-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'airflow']
      interval: 10s
      retries: 5

  # ── Apache Airflow ─────────────────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: ebc-airflow-init
    command: init
    restart: 'no'

  airflow-scheduler:
    <<: *airflow-common
    container_name: ebc-airflow-scheduler
    command: scheduler
    depends_on:
      postgres-meta:
        condition: service_healthy
      trino:
        condition: service_healthy
      trino-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: ebc-airflow-webserver
    command: webserver
    ports:
      - '127.0.0.1:8085:8080'
    depends_on:
      postgres-meta:
        condition: service_healthy
      trino:
        condition: service_healthy
      trino-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/health']
      interval: 30s
      retries: 5


volumes:
  kafka-data:
  minio-data:
  polaris-postgres-data:
