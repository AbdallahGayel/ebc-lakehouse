# =============================================================================
# trino/etc/catalog/iceberg.properties
# Iceberg connector wired to Apache Polaris (REST catalog) + MinIO (S3 storage).
#
# Trino authenticates to Polaris via OAuth2 client_credentials using the
# `root` principal seeded by polaris-bootstrap. All medallion namespaces
# (bronze / silver / gold / serving) appear as schemas in
# the `iceberg` catalog from Trino's perspective:
#   SELECT * FROM iceberg.silver.stg_ach_transactions;
# =============================================================================
connector.name=iceberg

iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=ebc_lakehouse

iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=root:s3cr3t
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.token-refresh-enabled=true

# Polaris hands back vended S3 credentials per table; honour them.
iceberg.rest-catalog.vended-credentials-enabled=true

# Native S3 file system (Trino 449+). Path-style for MinIO compatibility.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=minioadmin

# Iceberg engine tuning
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY
iceberg.register-table-procedure.enabled=false
iceberg.expire-snapshots.min-retention=7d
iceberg.remove-orphan-files.min-retention=7d
