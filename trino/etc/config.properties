# =============================================================================
# trino/etc/config.properties
# Single-node coordinator running the Iceberg-on-Polaris catalog.
# =============================================================================
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

query.max-memory=4GB
query.max-memory-per-node=2GB
query.client.timeout=10m

# Lower the default query result row buffer so dbt-trino streaming reads
# don't OOM on wide Silver/Gold tables.
exchange.compression-enabled=true
