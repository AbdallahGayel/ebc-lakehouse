# =============================================================================
# trino/etc/access-control.properties
# File-based access control for the EBC Lakehouse Trino cluster.
#
# Rules live in /etc/trino/rules.json (mounted alongside this file from
# trino/etc/). The 30s refresh lets the cluster pick up edits without
# requiring a restart.
# =============================================================================
access-control.name=file
security.config-file=/etc/trino/rules.json
security.refresh-period=30s
