source:
    type: kafka
    config:
        connection:
            consumer_config:
                security.protocol: PLAINTEXT
            bootstrap: 'kafka:29092'
            schema_registry_url: 'http://schema-registry:8081'
        stateful_ingestion:
            enabled: false
sink:
    type: datahub-rest
    config:
        server: 'http://datahub-gms:8080'

pipeline_name: ebc_kafka_ingestion
